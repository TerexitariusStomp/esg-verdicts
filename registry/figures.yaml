# figures.yaml — every headline number published, with its derivation.
# Regenerated by esg.export; verify gate re-runs derivations and fails on staleness.
figures:
  companies:
    value: 0
    derivation: "SELECT COUNT(*) FROM companies"
  reports:
    value: 0
    derivation: "SELECT COUNT(*) FROM reports"
  reports_harvested:
    value: 0
    derivation: "SELECT COUNT(*) FROM reports WHERE sha256 IS NOT NULL"
  extractions:
    value: 0
    derivation: "SELECT COUNT(*) FROM extractions"
  facilities:
    value: 0
    derivation: "SELECT COUNT(*) FROM facilities"
  facilities_matched:
    value: 0
    derivation: "SELECT COUNT(*) FROM facilities WHERE company_id IS NOT NULL"
  match_rate:
    value: 0
    derivation: "SELECT ROUND(1.0*SUM(company_id IS NOT NULL)/MAX(COUNT(*),1),3) FROM facilities"
  flags:
    value: 0
    derivation: "SELECT COUNT(*) FROM flags"
  flags_publishable:
    value: 0
    derivation: "SELECT COUNT(*) FROM flags WHERE publishable=1"
  claims:
    value: 0
    derivation: "SELECT COUNT(*) FROM claims"
  litigation:
    value: 0
    derivation: "SELECT COUNT(*) FROM litigation"
