<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG Verdicts — evidence-grade divergence registry</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
  h1{font-size:1.6rem} .sub{color:#555;margin-bottom:1.5rem}
  table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #ddd;padding:.4rem .5rem;text-align:left;font-size:.9rem}
  .label{font-size:.75rem;padding:.1rem .4rem;border-radius:3px;background:#eee}
  .documented{background:#d4edda}.reported{background:#fff3cd}.open{background:#f8d7da}
  #q{width:100%;padding:.5rem;margin:.8rem 0;font-size:1rem;box-sizing:border-box}
</style>
</head>
<body>
<h1>ESG Verdicts</h1>
<p class="sub">Filed disclosures vs physical-world data vs public statements.
Every figure below is verbatim-sourced and hash-pinned. Labels:
<span class="label documented">documented</span>
<span class="label reported">reported</span>
<span class="label open">open</span> — we do not assert intent.</p>
<input id="q" placeholder="Search companies…">
<table><thead><tr><th>Company</th><th>Reports</th><th>Flags</th><th>Status</th></tr></thead>
<tbody id="rows"></tbody></table>
<p class="sub" id="meta"></p>
<script>
const badge=s=>`<span class="label ${s}">${s}</span>`;
fetch('data/index.json').then(r=>r.json()).then(d=>{
  const rows=d.companies||d;
  document.getElementById('meta').textContent=
    `${rows.length} companies · generated ${d.generated||''}`;
  const render=q=>{
    document.getElementById('rows').innerHTML=rows
      .filter(c=>!q||c.name.toLowerCase().includes(q))
      .map(c=>`<tr><td><a href="data/company/${c.slug||c.id}.json">${c.name}</a></td>
        <td>${c.reports??''}</td><td>${c.flags??''}</td>
        <td>${badge(c.status||'open')}</td></tr>`).join('');
  };
  render('');
  document.getElementById('q').oninput=e=>render(e.target.value.toLowerCase());
});
</script>
</body>
</html>
